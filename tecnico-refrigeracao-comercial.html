<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Vocês atendem equipamento de qualquer marca?","acceptedAnswer":{"@type":"Answer","text":"Sim. Atendemos equipamentos comerciais e industriais de refrigeração de diversas marcas e modelos, inclusive os fora de linha e sem assistência autorizada na região, conforme a viabilidade técnica e a disponibilidade de peça. O que define o reparo é o sistema — compressor, condensador, evaporador, gás e controle — não o fabricante."}},{"@type":"Question","name":"Quanto custa a visita técnica?","acceptedAnswer":{"@type":"Answer","text":"Cobramos a visita de diagnóstico, e o valor é abatido do serviço caso o reparo seja aprovado. Passamos o valor no primeiro contato, antes de agendar. Parte dos casos se resolve na própria triagem por WhatsApp, sem visita."}},{"@type":"Question","name":"Em quanto tempo vocês atendem?","acceptedAnswer":{"@type":"Answer","text":"Trabalhamos com atendimento ágil e priorizamos equipamento parado em operação comercial, onde há perda de estoque ou de faturamento. O prazo depende da agenda do dia e da região; informamos no momento do contato. Nosso horário é de segunda a sábado, das 8h às 18h."}},{"@type":"Question","name":"Vale mais a pena consertar ou trocar o equipamento?","acceptedAnswer":{"@type":"Answer","text":"Depende da idade do equipamento, do custo do reparo e do histórico de falhas. Compressor queimado em equipamento antigo, com outros componentes no fim da vida útil, muitas vezes não compensa. Apresentamos o diagnóstico com o custo real do reparo para você decidir com número na mão — não empurramos serviço."}},{"@type":"Question","name":"Vocês fazem contrato de manutenção mensal?","acceptedAnswer":{"@type":"Answer","text":"Sim, com visitas programadas e escopo definido por equipamento. É a modalidade indicada para quem não pode ter parada: sai mais barato que o atendimento de emergência avulso e antecipa a falha antes de ela acontecer no horário de pico."}},{"@type":"Question","name":"Vocês oferecem curso ou vaga de técnico de refrigeração?","acceptedAnswer":{"@type":"Answer","text":"Não. Somos empresa de serviço e atendemos clientes com equipamento a instalar ou reparar. Não ministramos curso de refrigeração nem estamos com processo seletivo aberto por esta página."}}]}</script>
