/* ============================================================
   Doutor Chopeira — Design System
   Folha unica de producao: os 5 arquivos de tokens/ foram embutidos
   em 26/08/2026. Antes eram 5 @import, o que forcava o navegador a
   baixar styles.css, parsear, e so entao descobrir e baixar mais 5
   CSS bloqueantes em cadeia. Agora e uma requisicao.
   Fonte editavel: ui_kits/website/tokens/*.css
   ============================================================ */

/* ---------- tokens/fonts.css ---------- */
/* ============================================================
   Doutor Chopeira — Webfonts
   Headings: Poppins (geometric, friendly, confident)
   Body:     Mulish (clean, neutral, highly legible)
   Loaded from Google Fonts CDN. See readme.md → "Font substitution"
   note: provide self-hosted .woff2 files for fully offline use.
   ============================================================ */

/* fontes carregadas via <link> no HTML (mais rápido) */

/* ---------- tokens/colors.css ---------- */
/* ============================================================
   Doutor Chopeira — Color tokens
   Brand idea: commercial refrigeration (cold, blue, ice) meets
   the "chopp" (draft beer) heritage of the name (warm amber).
   Cold blue = trust + cold chain. Amber = energy + the chopeira.
   ============================================================ */

:root {
  /* ---- Base palette: Workwear Navy (primary / cold chain) ----
     Hue sampled from the technician's navy coverall photo (assets/tecnico-atendimento.jpg) */
  --blue-950: #171F2E;
  --blue-900: #212C42;
  --blue-800: #2B3A57;
  --blue-700: #36486C;
  --blue-600: #425A85;  /* primary brand navy */
  --blue-500: #566990;
  --blue-400: #7E90B1;
  --blue-300: #A9B6CD;
  --blue-200: #CFD8E6;
  --blue-100: #E7EBF3;

  /* ---- Ice / Cyan (cold accent, frost) ---- */
  --cyan-600: #0E8FAE;
  --cyan-500: #16A9C9;
  --cyan-400: #20BEDC;  /* ice accent */
  --cyan-300: #6CD6EA;
  --cyan-100: #DDF4F9;

  /* ---- Amber (the "chopp" / CTA warmth) ---- */
  --amber-700: #C97A06;
  --amber-600: #E8930C;
  --amber-500: #F7A516;  /* chopp / call-to-action */
  --amber-400: #FFB938;
  --amber-200: #FCE3B2;
  --amber-100: #FEF3DC;

  /* ---- Semantic status ---- */
  --green-500: #1FA463;  /* success / verified checkmark */
  --green-100: #DEF3E8;
  --red-500:   #D64545;  /* error */
  --red-100:   #FBE5E5;

  /* ---- Neutrals (cool-tinted slate) ---- */
  --ink:       #102230;  /* near-black headings */
  --slate-800: #1E3340;
  --slate-700: #38505F;
  --slate-600: #51697A;
  --slate-500: #6E8595;  /* muted text */
  --slate-400: #97AAB8;
  --slate-300: #C4D2DC;  /* borders */
  --slate-200: #DDE7EE;
  --slate-100: #ECF2F6;
  --mist:      #EAF2F8;  /* tinted section surface */
  --cloud:     #F5F9FC;  /* subtle surface */
  --white:     #FFFFFF;

  /* ============================================================
     Semantic aliases — reference these in components
     ============================================================ */

  /* Brand */
  --color-primary:        var(--blue-600);
  --color-primary-hover:  var(--blue-700);
  --color-primary-strong: var(--blue-800);
  --color-primary-deep:   var(--blue-900);
  --color-accent:         var(--cyan-400);
  --color-accent-strong:  var(--cyan-600);
  --color-cta:            var(--amber-500);
  --color-cta-hover:      var(--amber-600);
  --color-on-cta:         var(--ink);
  --color-whatsapp:       #25D366;  /* WhatsApp brand green */
  --color-whatsapp-hover: #1EBE5A;
  --color-on-whatsapp:    var(--white);

  /* Text */
  --text-strong:   var(--ink);
  --text-body:     var(--slate-700);
  --text-muted:    var(--slate-600);
  --text-inverse:  var(--white);
  --text-on-brand: var(--white);
  --text-link:     var(--blue-600);

  /* Surfaces */
  --surface-page:    var(--white);
  --surface-subtle:  var(--cloud);
  --surface-section: var(--mist);
  --surface-card:    var(--white);
  --surface-dark:    var(--blue-900);
  --surface-darker:  var(--blue-950);
  --surface-cta:     var(--amber-500);

  /* Borders & lines */
  --border-subtle: var(--slate-200);
  --border-default: var(--slate-300);
  --border-strong: var(--slate-400);
  --border-on-dark: rgba(255, 255, 255, 0.16);

  /* Status */
  --status-success: var(--green-500);
  --status-error:   var(--red-500);

  /* Focus ring */
  --ring: color-mix(in srgb, var(--blue-500) 55%, transparent);
}

/* ---------- tokens/typography.css ---------- */
/* ============================================================
   Doutor Chopeira — Typography tokens
   Poppins (display/headings) + Mulish (body/UI)
   ============================================================ */

:root {
  /* Families */
  --font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Mulish', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* Weights */
  --fw-regular: 400;   /* @kind font */
  --fw-medium: 500;    /* @kind font */
  --fw-semibold: 600;  /* @kind font */
  --fw-bold: 700;      /* @kind font */
  --fw-extrabold: 800; /* @kind font */

  /* Type scale (rem, 16px base) — fluid: scales down on small viewports */
  --fs-display: clamp(2.25rem, 1.1rem + 4.8vw, 3.5rem);   /* @kind other */
  --fs-h1: clamp(2rem, 1rem + 4vw, 2.75rem);              /* @kind other */
  --fs-h2: clamp(1.6rem, 1.05rem + 2.3vw, 2.125rem);      /* @kind other */
  --fs-h3: clamp(1.3rem, 1.1rem + 0.9vw, 1.5rem);         /* @kind other */
  --fs-h4: 1.25rem;       /* 20px card titles */
  --fs-lg: 1.125rem;      /* 18px lead */
  --fs-base: 1rem;        /* 16px body */
  --fs-sm: 0.875rem;      /* 14px */
  --fs-xs: 0.75rem;       /* 12px labels/eyebrow */

  /* Line heights */
  --lh-tight: 1.08;    /* @kind font */
  --lh-snug: 1.25;     /* @kind font */
  --lh-normal: 1.55;   /* @kind font */
  --lh-relaxed: 1.7;   /* @kind font */

  /* Letter spacing */
  --ls-tight: -0.02em;   /* @kind font */
  --ls-normal: 0;        /* @kind font */
  --ls-wide: 0.04em;     /* @kind font */
  --ls-eyebrow: 0.14em;  /* @kind font */

  /* Semantic text roles */
  --text-eyebrow-size: var(--fs-xs);
  --text-eyebrow-spacing: var(--ls-eyebrow);
}

/* ---------- tokens/spacing.css ---------- */
/* ============================================================
   Doutor Chopeira — Spacing, radii, shadows, layout
   8px base rhythm.
   ============================================================ */

:root {
  /* Spacing scale */
  --space-0: 0;
  --space-1: 0.25rem;  /* 4 */
  --space-2: 0.5rem;   /* 8 */
  --space-3: 0.75rem;  /* 12 */
  --space-4: 1rem;     /* 16 */
  --space-5: 1.5rem;   /* 24 */
  --space-6: 2rem;     /* 32 */
  --space-7: 2.5rem;   /* 40 */
  --space-8: 3rem;     /* 48 */
  --space-9: 4rem;     /* 64 */
  --space-10: 5rem;    /* 80 */
  --space-12: 7rem;    /* 112 — section padding */

  /* Radii */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  /* Shadows — cool-tinted, soft */
  --shadow-xs: 0 1px 2px rgba(8, 42, 77, 0.06);
  --shadow-sm: 0 2px 8px rgba(8, 42, 77, 0.08);
  --shadow-md: 0 8px 24px rgba(8, 42, 77, 0.10);
  --shadow-lg: 0 18px 48px rgba(8, 42, 77, 0.14);
  --shadow-cta: 0 10px 24px rgba(247, 165, 22, 0.32);

  /* Layout */
  --container-max: 1200px;  /* @kind spacing */
  --container-pad: 1.5rem;  /* @kind spacing */
  --section-y: var(--space-12);

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */
  --dur-fast: 0.15s;  /* @kind other */
  --dur-base: 0.25s;  /* @kind other */
  --dur-slow: 0.45s;  /* @kind other */
}

/* ---------- tokens/base.css ---------- */
/* ============================================================
   Doutor Chopeira — Base / reset + helpful utility primitives
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-normal);
  color: var(--text-body);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, h5 {
  font-family: var(--font-display);
  color: var(--text-strong);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  margin: 0;
}

p { margin: 0; }

a { color: var(--text-link); text-decoration: none; }
a:hover { color: var(--color-primary-hover); }

img { display: block; max-width: 100%; }

::selection { background: var(--cyan-300); color: var(--ink); }

:focus-visible {
  outline: 3px solid var(--ring);
  outline-offset: 2px;
}

/* ---- Reusable text roles ---- */
.ds-eyebrow {
  font-family: var(--font-body);
  font-weight: var(--fw-bold);
  font-size: var(--fs-xs);
  letter-spacing: var(--ls-eyebrow);
  text-transform: uppercase;
  color: var(--color-primary);
}

.ds-container {
  width: 100%;
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--container-pad);
}

/* ---- Mobile optimizations ---- */
@media (max-width: 960px) {
  /* Service-page hero on mobile: texto → foto → botão "Peça seu orçamento" */
  .svc-hero { gap: 24px !important; }
  .svc-hero-text { order: 1; }
  .svc-hero-media { order: 2; }
  .svc-actions-mobile { order: 3; display: flex !important; flex-direction: row; flex-wrap: wrap; }
  .svc-actions-mobile > * { width: auto !important; }
  .svc-actions-desktop { display: none !important; }
}
@media (max-width: 560px) {
  .svc-actions-mobile { flex-direction: column; }
  .svc-actions-mobile > * { width: 100% !important; }
}

@media (max-width: 640px) {
  h1 { font-size: clamp(2rem, 8vw, 2.5rem) !important; }
  h2 { font-size: clamp(1.6rem, 6.5vw, 2rem) !important; }
  .svc-hero-media img { aspect-ratio: 4 / 3 !important; }
  /* Comfortable tap targets + readable line length on phones */
  .ds-container { padding-inline: 1rem !important; }
  .gallery-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
}
