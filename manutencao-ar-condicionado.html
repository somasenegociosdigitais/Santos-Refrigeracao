<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Meu ar condicionado não está gelando. É falta de gás?","acceptedAnswer":{"@type":"Answer","text":"Pode ser, mas é apenas uma das causas. Serpentina obstruída, condensadora suja, capacitor com perda de capacidade, placa com defeito e sensor descalibrado dão o mesmo sintoma. Medimos pressão de alta e baixa antes de concluir — e se for gás, localizamos o vazamento, porque gás não se consome, ele escapa."}},{"@type":"Question","name":"Preciso recarregar o gás todo ano?","acceptedAnswer":{"@type":"Answer","text":"Não. Em sistema íntegro a carga de gás dura anos. Recarga anual é sinal de vazamento não localizado. Recarregar sem reparar é serviço que dura poucos meses e custa duas vezes."}},{"@type":"Question","name":"Qual a diferença entre manutenção e higienização?","acceptedAnswer":{"@type":"Answer","text":"A higienização trata a limpeza: filtros, serpentina, turbina, bandeja e dreno. A manutenção inclui isso e vai além — medição de pressão, verificação da carga de gás, teste do capacitor, aperto de conexões elétricas e avaliação do compressor. Veja também a página de <a href=\"higienizacao-ar-condicionado.html\">higienização de ar condicionado</a>."}},{"@type":"Question","name":"Vale consertar ou trocar o aparelho?","acceptedAnswer":{"@type":"Answer","text":"Depende da idade, do custo do reparo e do histórico. Compressor queimado em aparelho de dez anos, com outros componentes no fim da vida, geralmente não compensa. Apresentamos o custo real do reparo para você decidir com número na mão."}},{"@type":"Question","name":"Vocês fazem contrato de manutenção mensal?","acceptedAnswer":{"@type":"Answer","text":"Sim, com visitas programadas, escopo definido por equipamento e relatório por atendimento. É a modalidade indicada para comércio, escritório, clínica e condomínio, e sai mais barato que chamados avulsos."}}]}</script>
