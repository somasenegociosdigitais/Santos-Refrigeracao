eralmente não compensa. Apresentamos o custo real do reparo para você decidir com número na mão."}},{"@type":"Question","name":"Vocês fazem contrato de manutenção mensal?","acceptedAnswer":{"@type":"Answer","text":"Sim, com visitas programadas, escopo definido por equipamento e relatório por atendimento. É a modalidade indicada para comércio, escritório, clínica e condomínio, e sai mais barato que chamados avulsos."}}]}</script>
