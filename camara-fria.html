<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Vocês atendem fora do horário comercial?","acceptedAnswer":{"@type":"Answer","text":"Para equipamentos que não podem parar — câmara fria, ultra freezer, ilha de congelados — sim. Ligue e avaliamos o caso na hora. Prejuízo por hora parada é o critério, não o relógio."}},{"@type":"Question","name":"Como funciona a instalação de uma câmara fria do zero?","acceptedAnswer":{"@type":"Answer","text":"Seguimos etapas estruturadas: estudo da carga térmica e do tipo de produto (resfriado ou congelado), dimensionamento do motor, esquadrejamento e nivelamento da base, montagem dos painéis isotérmicos, fixação das unidades evaporadora e condensadora, parte elétrica e hidráulica, e vedação final com silicone. Você recebe o projeto e o preço fechado antes de começar."}},{"@type":"Question","name":"Qual a diferença entre câmara para resfriados e para congelados?","acceptedAnswer":{"@type":"Answer","text":"A finalidade define o projeto: resfriamento de bebidas e laticínios trabalha em temperaturas positivas; congelamento de carnes exige temperaturas negativas, motor mais robusto, isolamento reforçado e resistência de dreno para evitar congelamento interno. Por isso o dimensionamento correto é essencial."}},{"@type":"Question","name":"De quanto em quanto tempo fazer a manutenção preventiva?","acceptedAnswer":{"@type":"Answer","text":"Recomendamos visitas programadas periódicas, com limpeza do condensador, inspeção de gaxetas, verificação do fluido refrigerante e teste de drenos. O condensador sujo é a principal causa de motor desarmando ou queimando em dias quentes — a preventiva evita a parada e reduz a conta de luz."}},{"@type":"Question","name":"Minha câmara não atinge a temperatura. O que pode ser?","acceptedAnswer":{"@type":"Answer","text":"As causas mais comuns são parâmetros desajustados no controlador digital, gás refrigerante baixo por microvazamento, condensador sujo ou gaxetas de vedação ressecadas. Fazemos o diagnóstico medindo pressão e temperatura para corrigir a causa real, não só o sintoma."}},{"@type":"Question","name":"Vocês fazem reforma e contrato de manutenção regular?","acceptedAnswer":{"@type":"Answer","text":"Sim. Atendemos instalação do zero, reforma de câmaras existentes (substituição de painéis, readequação de vedação, modernização do sistema) e contratos de manutenção regular com visitas programadas — ideal para quem não pode ter parada no estoque."}}]}</script>
