<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"De quanto em quanto tempo fazer a limpeza do ar condicionado?","acceptedAnswer":{"@type":"Answer","text":"Para uso residencial, o ideal é a cada 6 meses; em ambiente comercial de uso intenso, a cada 3 meses. A limpeza de filtros e serpentina mantém o gelo eficiente, reduz o consumo de energia e evita mofo e alergias."}},{"@type":"Question","name":"Meu ar condicionado não está gelando. O que pode ser?","acceptedAnswer":{"@type":"Answer","text":"Normalmente é gás baixo por vazamento, filtro e serpentina sujos, capacitor fraco ou dimensionamento incorreto para o ambiente. Medimos a pressão e a temperatura para identificar a causa e corrigir de forma definitiva, não só recarregar gás."}},{"@type":"Question","name":"Vocês atendem residência ou só comércio?","acceptedAnswer":{"@type":"Answer","text":"Atendemos os dois. Fazemos instalação e manutenção de ar condicionado comercial (lojas, escritórios, restaurantes, indústrias) e residencial (apartamentos e casas) em todo o Rio e Grande Rio."}},{"@type":"Question","name":"Está pingando água da unidade interna. É grave?","acceptedAnswer":{"@type":"Answer","text":"Quase sempre é o dreno entupido ou sem caimento, ou gelo se formando na serpentina por falta de limpeza. Fazemos o desentupimento e a correção do dreno e higienizamos o aparelho para resolver."}},{"@type":"Question","name":"Vocês fazem a instalação completa, com tubulação?","acceptedAnswer":{"@type":"Answer","text":"Sim. Fazemos a instalação do zero com dimensionamento de BTUs, passagem de tubulação de cobre, vácuo na linha, carga de gás e dreno — deixando o aparelho pronto e com garantia."}}]}</script>
