<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Qual a diferença entre adega de compressor e termoelétrica?","acceptedAnswer":{"@type":"Answer","text":"A de compressor refrigera como uma geladeira, atinge temperaturas mais baixas e suporta maior capacidade e calor ambiente — ideal para uso comercial. A termoelétrica (pastilha Peltier) é mais silenciosa e com menos vibração, indicada para menores capacidades. Atendemos e consertamos os dois tipos."}},{"@type":"Question","name":"Minha adega não está mantendo a temperatura. O que pode ser?","acceptedAnswer":{"@type":"Answer","text":"As causas comuns são gás baixo por vazamento, condensador sujo, controle eletrônico desregulado, vedação da porta gasta ou, nas termoelétricas, falha na pastilha e no ventilador. Medimos e diagnosticamos para corrigir a causa real, não só o sintoma."}},{"@type":"Question","name":"Por que aparece condensação no vidro da adega?","acceptedAnswer":{"@type":"Answer","text":"A condensação surge quando a umidade e a temperatura estão desreguladas ou a vedação da porta está gasta. Ajustamos o sistema e trocamos a borracha de vedação para o vidro ficar limpo e as garrafas bem visíveis."}},{"@type":"Question","name":"Vocês instalam e atendem adega residencial também?","acceptedAnswer":{"@type":"Answer","text":"Sim. Atendemos adegas comerciais (restaurantes, bares, adegas) e residenciais, de garrafeiras a expositores de grande capacidade, com instalação nivelada, regulagem e garantia no serviço."}}]}</script>
