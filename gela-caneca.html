<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Por que o gela caneca parou de congelar as canecas?","acceptedAnswer":{"@type":"Answer","text":"As causas mais comuns são gás refrigerante baixo por microvazamento, condensador sujo, termostato desregulado ou compressor com desgaste. Medimos pressão e temperatura para identificar a causa real e corrigir só o que precisa."}},{"@type":"Question","name":"Com que frequência devo fazer manutenção?","acceptedAnswer":{"@type":"Answer","text":"Recomendamos revisão preventiva periódica, com limpeza do condensador, verificação de gás e degelo técnico. Em locais de alto movimento, a preventiva evita a parada no fim de semana e mantém o consumo de energia sob controle."}},{"@type":"Question","name":"Formou muito gelo dentro do equipamento. É problema?","acceptedAnswer":{"@type":"Answer","text":"Sim. O excesso de gelo indica falha na vedação, no degelo ou umidade entrando no equipamento. Além de reduzir o espaço útil, força o motor e aumenta a conta de luz. Fazemos o degelo técnico e corrigimos a causa."}},{"@type":"Question","name":"Vocês instalam gela caneca novo?","acceptedAnswer":{"@type":"Answer","text":"Sim. Fazemos a instalação com nivelamento correto, avaliação do ponto elétrico e regulagem inicial da temperatura, deixando o equipamento pronto para operar com a camada de gelo no ponto."}}]}</script>
