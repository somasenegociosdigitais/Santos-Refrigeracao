<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Vocês fazem só a tubulação ou a instalação completa?","acceptedAnswer":{"@type":"Answer","text":"Fazemos as duas. Podemos executar apenas a infraestrutura — tubulação de cobre, dreno, elétrica e suportes — para o equipamento ser instalado depois, ou a instalação completa com vácuo, carga de gás e start-up. Muita obra contrata a infraestrutura na fase de alvenaria e o equipamento meses depois."}},{"@type":"Question","name":"Vocês vendem o tubo de cobre?","acceptedAnswer":{"@type":"Answer","text":"Somos empresa de serviço, não de material. Fornecemos o tubo e os insumos dentro do orçamento da obra, com a bitola correta para o seu equipamento, mas não trabalhamos com venda de tubo avulso."}},{"@type":"Question","name":"Qual a distância máxima entre a evaporadora e a condensadora?","acceptedAnswer":{"@type":"Answer","text":"Depende do modelo. Cada fabricante especifica o comprimento máximo de linha e o desnível permitido, e passar desse limite exige carga adicional de gás ou inviabiliza o trajeto. Verificamos a especificação do seu equipamento antes de definir o percurso."}},{"@type":"Question","name":"Dá para passar tubulação em imóvel já pronto, sem quebrar?","acceptedAnswer":{"@type":"Answer","text":"Na maioria dos casos, sim — com passagem aparente em canaleta, por forro ou por shaft existente. Avaliamos o imóvel e apresentamos as opções com o acabamento de cada uma antes de você decidir."}},{"@type":"Question","name":"O que é o vácuo e por que ele importa?","acceptedAnswer":{"@type":"Answer","text":"É a retirada do ar e da umidade de dentro da tubulação com bomba, antes da carga de gás. Sem isso, a umidade reage com o óleo do compressor e forma ácido, que corrói o sistema por dentro ao longo de meses. É a etapa mais pulada do mercado e uma das principais causas de compressor queimado em aparelho novo."}}]}</script>
