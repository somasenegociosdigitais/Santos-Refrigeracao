<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Vocês fazem higienização de ar condicionado automotivo?","acceptedAnswer":{"@type":"Answer","text":"Não. Trabalhamos com ar condicionado de ambiente — split, multi split, janela, cassete e piso-teto — em comércio, escritório e residência. Higienização de ar condicionado de carro é serviço automotivo, com equipamento e acesso completamente diferentes, e não faz parte do nosso escopo."}},{"@type":"Question","name":"Qual a diferença entre limpar o filtro e higienizar?","acceptedAnswer":{"@type":"Answer","text":"Lavar o filtro é manutenção de usuário e remove só a poeira da superfície. A higienização desmonta o conjunto e trata o que está atrás do filtro: serpentina, turbina, bandeja e dreno. É ali que se forma o biofilme responsável pelo cheiro e pela queda de rendimento — e é a parte que a limpeza doméstica não alcança."}},{"@type":"Question","name":"Quanto tempo demora e preciso desligar o ambiente?","acceptedAnswer":{"@type":"Answer","text":"Uma unidade split leva em média de uma a duas horas, dependendo do grau de sujeira e do acesso. Trabalhamos com bolsa coletora e proteção de piso e móveis, então o ambiente continua utilizável ao redor. Em loja e escritório podemos agendar fora do horário de funcionamento."}},{"@type":"Question","name":"A higienização reduz a conta de luz?","acceptedAnswer":{"@type":"Answer","text":"Costuma reduzir. Serpentina obstruída diminui a troca térmica, e o compressor precisa ficar mais tempo ligado para chegar à temperatura configurada. Medimos a temperatura de insuflamento antes e depois, o que dá para ver o ganho de rendimento na prática."}},{"@type":"Question","name":"Vocês atendem vários aparelhos de uma vez?","acceptedAnswer":{"@type":"Answer","text":"Sim. Atendemos parque de equipamentos com visita programada e relatório por unidade, e trabalhamos com contrato de higienização periódica para comércio, escritório, clínica e condomínio."}}]}</script>
