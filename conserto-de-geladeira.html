<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Vocês atendem geladeira residencial ou só comercial?","acceptedAnswer":{"@type":"Answer","text":"Atendemos as duas. Geladeira doméstica de diversas marcas — uma porta, duplex, frost free, side by side, inverse — além de frigobar, geladeira e refrigerador comercial e industrial. O atendimento é no local, no Rio de Janeiro e Grande Rio."}},{"@type":"Question","name":"A geladeira não está gelando. O que pode ser?","acceptedAnswer":{"@type":"Answer","text":"As causas mais comuns são compressor sem partida, gás baixo por vazamento, termostato ou sensor com defeito, placa eletrônica queimada e condensador obstruído. Os sintomas são parecidos e a causa é diferente, por isso medimos pressão e corrente antes de concluir — trocar peça por tentativa sai mais caro."}},{"@type":"Question","name":"Preciso levar a geladeira ou vocês vão até mim?","acceptedAnswer":{"@type":"Answer","text":"Vamos até você. Atendimento no local é a regra, e não só por comodidade: geladeira deitada ou transportada sem cuidado pode ter migração do óleo do compressor para o circuito, criando um problema que não existia. Só levamos para a oficina quando o reparo exige bancada."}},{"@type":"Question","name":"Está juntando água dentro da geladeira. É grave?","acceptedAnswer":{"@type":"Answer","text":"Normalmente é dreno obstruído — o caminho da água do degelo entope e ela transborda, aparecendo na gaveta de legumes ou no chão. É um dos reparos mais simples e baratos, mas se ficar sem tratar pode molhar a parte elétrica."}},{"@type":"Question","name":"Vale consertar ou comprar uma nova?","acceptedAnswer":{"@type":"Answer","text":"Depende do reparo e da idade. Dreno, borracha e degelo quase sempre compensam. Compressor e placa eletrônica em equipamento de mais de dez anos merecem comparação com o preço de um novo. Apresentamos o custo fechado e a nossa leitura técnica para você decidir com número na mão."}},{"@type":"Question","name":"Vocês consertam freezer também?","acceptedAnswer":{"@type":"Answer","text":"Sim. Freezer vertical e horizontal, doméstico e comercial, além de ultra freezer e equipamentos de baixa temperatura — veja a página de <a href=\"ultra-freezer.html\">ultra freezer</a> para operações que trabalham abaixo de -40 °C."}}]}</script>
