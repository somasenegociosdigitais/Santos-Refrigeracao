/* ---------- tokens/typography.css ---------- */
/* ============================================================
   Doutor Chopeira — Typography tokens
   Poppins (display/headings) + Mulish (body/UI)
   ============================================================ */

:root {
  /* Families */
  --font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --fs-lg: 1.125rem;      /* 18px lead */
  --fs-base: 1rem;        /* 16px body */
  --fs-sm: 0.875rem;      /* 14px */
  --fs-xs: 0.75rem;       /* 12px labels/eyebrow */

  /* Line heights */
  --lh-tight: 1.08;    /* @kind font */
  --lh-snug: 1.25;     /* @kind font */
  --lh-normal: 1.55;   /* @kind font */
  --lh-relaxed: 1.7;   /* @kind font */

  /* Letter spacing */
  --ls-tight: -0.02em;   /* @kind font */
  --ls-normal: 0;        /* @kind font */

  /* Semantic text roles */
  --text-eyebrow-size: var(--fs-xs);
  --text-eyebrow-spacing: var(--ls-eyebrow);
}

/* ---------- tokens/spacing.css ---------- */
/* ============================================================

   8px base rhythm.
   ============================================================ */

:root {
  /* Spacing scale */
  --space-0: 0;
  --space-1: 0.25rem;  /* 4 */

  /* Radii */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  /* Shadows — cool-tinted, soft */
  --shadow-xs: 0 1px 2px rgba(8, 42, 77, 0.06);
  --shadow-sm: 0 2px 8px rgba(8, 42, 77, 0.08);
  --shadow-md: 0 8px 24px rgba(8, 42, 77, 0.10);
  --shadow-lg: 0 18px 48px rgba(8, 42, 77, 0.14);

  /* Layout */
  --container-max: 1200px;  /* @kind spacing */

  --dur-fast: 0.15s;  /* @kind other */
  --dur-base: 0.25s;  /* @kind other */
  --dur-slow: 0.45s;  /* @kind other */
}

/* ============================================================

*, *::before, *::after { box-sizing: border-box; }

body {

p { margin: 0; }

a { color: var(--text-link); text-decoration: none; }
